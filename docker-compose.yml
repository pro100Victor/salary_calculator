services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
      POSTGRES_DB: salary
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build: .
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://salary:salary@db:5432/salary
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: python src/web_main.py
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://salary:salary@db:5432/salary
      STORAGE_BACKEND: postgres
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  pgdata:
