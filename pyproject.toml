[project]
name = "salary-calculator"
version = "0.1.0"
description = "Консольный InMemory-прототип расчёта заработной платы"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
